[package]
name = "Koimsurai_NAS"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
# ⚠️ 要跟 tower-sessions-sqlx-store 用同一個 tower-sessions-core。
# store 0.15 依賴的是 core **0.14**；配 tower-sessions 0.15（core 0.15）的話
# `SqliteStore: SessionStore` 不成立 —— 那是兩個不同的 trait，
# 錯誤訊息只說「trait 沒實作」，看不出是版本錯配。
tower-sessions = "0.14"
axum-extra = { version = "0.12", features = ["cookie"] }
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.0", features = ["axum_extras", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
mime_guess = "2.0"
image = "0.25.9"
sysinfo = "0.33.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
dav-server = { version = "0.11.0", features = ["localfs"] }
notify = "8.2.0"
walkdir = "2.5.0"
exif = { package = "kamadak-exif", version = "0.6.1" }
id3 = "1.16.3"
mp4 = "0.14.0"
tantivy = "0.25.0"
sha2 = "0.10.9"
urlencoding = "2.1.3"
bollard = "0.19.4"
zip = "2"

# 2FA / TOTP（RFC 6238）
totp-rs = { version = "5.6", features = ["qr", "gen_secret"] }

# AI/ML 依賴 (CLIP 模型推理)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
hf-hub = { version = "0.3", optional = true }
tokenizers = { version = "0.21", optional = true }
time = "0.3.44"
specta = { version = "=2.0.0-rc.25", features = [
  "derive",
  "chrono",
  "uuid",
  "serde_json",
  "collect",
] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# tus 1.0.0（可續傳上傳協定）。
#
# ⚠️ 刻意**只**用 tus-protocol，不用 tus-axum / tus-server。
# 後兩者會拖進 67 個 crate —— 包含 opendal、aws-lc-sys（要 cmake 的 C/組語
# 密碼庫）、jni（Java Native Interface）、clap。為了續傳上傳把那些放進建置
# 相依完全不成比例。tus-protocol 單獨加只多**一個** crate、零傳遞相依：
# 它是「自帶儲存」的純協定核心，HTTP 那層我們自己接（handlers/tus.rs），
# 於是路徑檢查仍然走 StorageRoot。
tus-protocol = { version = "0.1.0", features = ["storage-file", "state-file", "lock-memory"] }

[features]
default = []
ai = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "tokenizers"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
# multipart：upload_link_tests 要模擬瀏覽器的檔案上傳（含 relative_path 欄位）
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
tempfile = "3.10"
# auth_guard_tests 要手工鑄一張**已過期**的 token（正式 API 只發 now+15min 的，
# 造不出過期的那張），才驗得到 exp 檢查真的有在看。版本跟上面的正式相依一致。
jsonwebtoken = "9.3"
proptest = "1.9.0"

[lints]
workspace = true
