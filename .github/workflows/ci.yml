name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小權限：所有 job 只需讀 repo（zizmor excessive-permissions）。
permissions:
  contents: read

# 同分支/PR 有新 push 就取消進行中的舊 run，省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# action 一律釘 commit SHA：tag 可被移動，上游 repo 被入侵即等於在 CI 執行任意程式碼
# （zizmor unpinned-uses）。checkout 一律 persist-credentials: false —— 預設會把
# git 憑證留在工作區（zizmor artipacked）。

jobs:
  frontend:
    name: Frontend · tsc + oxfmt + oxlint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tsconfig 開著 noUnusedLocals / noUnusedParameters，死碼在這裡就會擋下。
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

      # JS/TS 的格式。sora-to-ki 沒有這道（那邊 oxlint 管 lint、biome 只管 CSS，
      # JS/TS 的格式無人看守），這裡補上。
      # ⚠️ 必須排在 oxlint **之前或之後都可以，但本機 hook 裡要在 oxlint 之後**：
      #    oxfmt 會把單行的 `if (x) { a; return; }` 展開成多行，而
      #    `// eslint-disable-next-line` 只蓋下一行，展開後違規就跑到抑制範圍外。
      # ⚠️ oxfmt 排除了 CSS（見 package.json 的 script）：CSS 歸 biome 管，
      #    兩個 formatter 對同一個檔案有不同意見會互相把對方的結果改回去。
      - name: oxfmt --check
        run: pnpm check:format

      # 存量已經清到 0（導入當下是 594：error 401 / warning 193），所以這道
      # 從 continue-on-error 改成真的擋。`--max-warnings 0` 是關鍵——沒有它，
      # warning 會靜靜地累積回去，而這批規則裡最會抓到真 bug 的幾條
      # （no-unnecessary-condition、exhaustive-deps、set-state-in-effect）
      # 預設就是 warning。
      #
      # 清理過程中確實留了一些 oxlint-disable，每一個旁邊都寫了為什麼那裡
      # 不能照規則做（虛擬清單需要 roving tabindex、button 不能巢狀、
      # 對話框的 autoFocus 是 WAI-ARIA 要求的…）。
      - name: oxlint（type-aware）
        run: pnpm exec oxlint --type-aware --tsconfig=tsconfig.json --max-warnings 0 src

      # CSS 的格式與 lint（biome 只管 CSS，JS/TS 交給 oxlint + oxfmt）
      - name: biome（CSS）
        run: pnpm lint:css

      # --passWithNoTests 已經拿掉：測試存在了，空跑就該是錯誤。
      - name: vitest
        run: pnpm test

      - name: build
        run: pnpm exec vite build

  backend:
    name: Backend · clippy + nextest + specta drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # llvm-tools-preview 是 cargo-llvm-cov 的前提（它用 LLVM 的
          # instrumentation-based coverage，不是 gcov）
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          prefix-key: v1-rust
          shared-key: workspace-lint-test
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-shear,typos-cli

      # ⚠️ 這三道都要在 **repo 根**跑，不是 backend/：
      #   typos 掃整個 repo（含 .md 與 workflow 檔），在 backend/ 底下會漏掉根目錄的檔案
      #   cargo shear / audit 認的是 workspace root 的 Cargo.lock
      - name: cargo-shear（未使用的 Rust 相依）
        working-directory: .
        run: cargo shear
      - name: typos（錯字；白名單見 .typos.toml）
        working-directory: .
        run: typos

      # 設定見 backend/rustfmt.toml（max_width=110，不設 use_small_heuristics）
      - name: cargo fmt --check
        run: cargo fmt --check

      # lint 設定在根 Cargo.toml 的 [workspace.lints]，backend 用 [lints] workspace = true
      # 繼承。`unwrap_used` 另外寫在三個 crate root 的 #![deny(...)]（見 src/lib.rs 說明）。
      - name: clippy (-D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      # ⚠️ 一律 nextest 且帶 --no-fail-fast。`cargo test` 在這個專案是壞的：
      # 測試會寫 process 全域的 env 與 static，同行程平行跑會互相蓋，症狀是
      # 「隨機幾條紅、每次紅的還不一樣」，看起來完全像測試本身會抖。
      #
      # 用 llvm-cov 包起來跑，一次拿到「測試有沒有過」與「涵蓋了多少」兩個訊號
      # ——分成兩道會把整個測試套件跑兩次。
      #
      # ⚠️ --fail-under-regions 30 是**棘輪**不是目標。實測 32.12%
      #    （functions 29.61 / lines 32.89），留約 2pp 餘裕：加一段還沒測到的
      #    新功能不該當場擋下，但「刪掉一批測試」會被抓到。補了測試就把數字往上調。
      #
      #    數字本身不必太在意——真正該看的是分佈，見下面那步印出來的逐檔表。
      #    已補完的（都屬於「壞了不會有症狀」那類）：
      #      handlers/share.rs        0 → 91.9%（密碼與過期；反了 = 連結永不過期）
      #      handlers/upload_link.rs  0 → 88.7%（唯一免身分就能寫檔案的端點）
      #      middleware/auth.rs      48 → 94.6%（補測試時抓到一個 CSRF 繞過）
      #      utils/jwt.rs            52 → 90.0%
      #
      #    還是 0% 且值得補的：
      #      handlers/terminal.rs     受限 shell 的指令白名單
      #      handlers/upload.rs       分塊續傳的 offset
      #      utils/image.rs           縮圖產生（會處理使用者上傳的檔案）
      - name: nextest + 覆蓋率
        run: |
          cargo llvm-cov nextest --locked --no-fail-fast \
            --fail-under-regions 30 --summary-only 2>&1 | tee coverage.txt

      # 逐檔表寫進 job summary：聚合數字看不出「哪裡是空的」，而那才是要看的。
      # !cancelled()：沒過門檻時上一步會紅，那時候最需要看這張表。
      - name: 覆蓋率摘要
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### 後端覆蓋率'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 契約守門：Rust struct 改了卻沒重跑 export_types → 產生的 TS 與 committed 不一致 → 擋下。
      # 這是型別橋唯一的自動保障，少了它「漏改」不會有任何症狀。
      - name: specta 型別是否為最新
        run: |
          cargo run --locked --bin export_types
          cd ..
          git diff --exit-code packages/api-types/index.ts

      - name: cargo audit
        working-directory: .
        run: cargo audit

  workflows:
    name: Workflows · actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: zizmor
      - name: zizmor
        run: zizmor .github/workflows/
