# 每條 E2E 跑三遍，把「靠 race 贏來的綠燈」篩出來。
#
# 為什麼要有這個：這個專案已經連續踩到七次「綠燈在說謊」。最貴的一次是
# window-management 的 z-order —— 本機綠、CI 紅，原因是新視窗的進場動畫在
# 本機還沒停，點下去剛好沒被 resize 把手擋到。單跑一次永遠測不出這種東西。
#
# 第一次開這個掃描（2026-09-04）：189 次執行裡有 10 次失敗，涵蓋 8 條測試，
# 而它們在平常的單次 CI 裡全都是綠的。其中 9 條指向同一個**真的後端 bug**
# （tus 落地沒有寫 files 表，列表全靠 inotify watcher）。也就是說 flake 掃描
# 找到的不只是測試寫壞，是產品壞了但測試剛好蓋不到。
#
# ⚠️ 這個是排程跑的，不擋 PR。它的產出是「哪幾條不穩」，修不修由人決定 ——
#    掛在 required check 上只會讓人習慣性 re-run，那就白做了。
name: E2E Flake Sweep

on:
  schedule:
    # 每週日 22:00 UTC —— 排在 api-fuzz（20:00）與 mutation（21:00）之後，
    # 免得三個都在搶 runner。
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      repeat:
        description: 每條測試重複幾次
        required: false
        default: "3"

concurrency:
  group: e2e-flake
  cancel-in-progress: false

permissions:
  contents: read

env:
  E2E_PORT: "3098"
  E2E_INVITE_CODE: e2e_invite

jobs:
  sweep:
    name: repeat-each sweep
    runs-on: ubuntu-latest
    # 189 次執行在本機是 9 分鐘；CI 的 runner 慢得多，而且失敗的那幾條會各自
    # 等滿 20~25 秒的 poll timeout。留寬一點。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          prefix-key: v1-rust
          shared-key: workspace-lint-test
          save-if: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 安裝 Playwright 瀏覽器
        run: pnpm exec playwright install --with-deps chromium

      - name: 建前端 bundle
        run: pnpm build

      - name: 建 server binary
        run: cargo build --locked --bin Koimsurai_NAS

      # ⚠️ 這裡刻意**不**用 --retries。重試會把 flake 藏起來，而藏起來正是
      #    這個 workflow 要解決的問題。
      - name: repeat-each sweep
        run: pnpm exec playwright test --repeat-each=${{ inputs.repeat || '3' }} --workers=2 --retries=0

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-sweep-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
