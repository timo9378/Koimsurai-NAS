# 找出「靠時序僥倖過」的 E2E。
#
# ⚠️ 為什麼需要它：一般的 E2E job 設了 `retries: 1`，所以失敗一次、重試成功的
# 測試會被算成通過 —— 而那正是最該修的一類。這個 session 就抓到兩條：
#
#   - 桌面圖示的鍵盤拖曳：拿起之後立刻按方向鍵會被丟掉（約 25% 紅）
#   - 視窗 z-order：第二個視窗的上緣縮放把手蓋在第一個的標題列中央，
#     本機因為進場動畫還沒收斂而點得到，CI 較慢就必然攔截
#
# 兩條在一般 CI 都是綠的。要讓它們顯形只有「重複跑、且不重試」。
#
# 每週跑一次就夠：它抓的是**新加的**測試有沒有靠 race，而不是既有的退步。
name: Flake Hunt

on:
  workflow_dispatch:
  schedule:
    # 每週六 20:00 UTC = 週日 04:00 Asia/Taipei（跟 api-fuzz、mutants 錯開）
    - cron: "0 20 * * 6"

concurrency:
  group: flake-hunt
  cancel-in-progress: true

permissions:
  contents: read

env:
  E2E_PORT: "3098"
  E2E_INVITE_CODE: e2e_invite

jobs:
  flake-hunt:
    name: Playwright ×3（不重試）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          prefix-key: v1-rust
          shared-key: workspace-lint-test
          # 這個 workflow 不是 cache 的產生者 —— 讓 ci.yml 負責寫，這裡只讀。
          save-if: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ⚠️ 版本要跟 lockfile 裡的 @playwright/test 一致，否則會下載到另一版
      #    瀏覽器、留下兩份。用 pnpm exec 而不是全域的 npx 就是為了這個。
      - name: 安裝 Playwright 瀏覽器
        run: pnpm exec playwright install --with-deps chromium

      - name: 建前端 bundle
        run: pnpm build

      - name: 建 server binary
        run: cargo build --locked --bin Koimsurai_NAS

      # webServer 由 playwright.config.ts 起（scripts/e2e-server.sh），
      # 它會自己準備 temp DB 與 storage。
      # ⚠️ `--retries=0` 是重點。有重試的話「失敗一次、第二次過」會被算成通過，
      # 而那正是這個 job 要抓的東西。
      - name: playwright test ×3
        run: pnpm exec playwright test --repeat-each=3 --retries=0

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-hunt-report
          path: playwright-report/
          retention-days: 7
